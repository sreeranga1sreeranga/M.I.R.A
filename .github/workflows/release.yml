name: Build & Publish M.I.R.A. Installers (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS
            installer_type: dmg
          - os: windows-latest
            platform_name: Windows
            installer_type: exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout M.I.R.A. Source Code
        uses: actions/checkout@v4

      - name: Determine App Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "APP_VERSION=2.5.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Package Shaded Fat-JAR
        run: mvn clean package -DskipTests

      - name: Stage Shaded JAR for jpackage
        shell: bash
        run: |
          mkdir -p jpackage-input dist
          cp target/mira-1.0.0-shaded.jar jpackage-input/mira-1.0.0-shaded.jar

      - name: Build Native macOS (.dmg) Installer
        if: matrix.os == 'macos-latest'
        run: |
          jpackage \
            --input jpackage-input \
            --name "MIRA" \
            --main-jar mira-1.0.0-shaded.jar \
            --main-class com.radialtool.Launcher \
            --type dmg \
            --app-version "${{ steps.version.outputs.APP_VERSION }}" \
            --vendor "Sreeranga V" \
            --java-options "-Dapple.awt.UIElement=true" \
            --dest dist
          cp jpackage-input/mira-1.0.0-shaded.jar "dist/MIRA-${{ steps.version.outputs.APP_VERSION }}-Universal.jar"

      - name: Install Portable WiX Toolset v3.14 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $wixUrl -OutFile "wix314.zip"
          Expand-Archive -Path "wix314.zip" -DestinationPath "C:\wix314" -Force
          echo "C:\wix314" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Native Windows (.exe) Installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          jpackage `
            --input jpackage-input `
            --name "MIRA" `
            --main-jar mira-1.0.0-shaded.jar `
            --main-class com.radialtool.Launcher `
            --type exe `
            --app-version "${{ steps.version.outputs.APP_VERSION }}" `
            --vendor "Sreeranga V" `
            --win-shortcut `
            --win-menu `
            --dest dist

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-${{ matrix.platform_name }}-Installer
          path: dist/*

  publish-release:
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Built Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release with macOS & Windows Installers
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
