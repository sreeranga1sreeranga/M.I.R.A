<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.I.R.A. Luxury Radial Interface</title>
  <style>
    :root {
      /* Theme 0: Obsidian & Champagne Gold */
      --bg-glass: rgba(12, 13, 18, 0.78);
      --bg-hub: rgba(16, 18, 24, 0.92);
      --stroke-base: rgba(212, 175, 55, 0.28);
      --stroke-hover: rgba(255, 232, 150, 0.95);
      --fill-hover-start: #d4af37;
      --fill-hover-end: #9a7b1c;
      --text-main: #f3EFEA;
      --text-hover: #090a0f;
      --accent: #e5c158;
      --glow: rgba(212, 175, 55, 0.35);
    }

    body.theme-titanium {
      /* Theme 1: Titanium Frost */
      --bg-glass: rgba(245, 248, 252, 0.82);
      --bg-hub: rgba(255, 255, 255, 0.94);
      --stroke-base: rgba(148, 163, 184, 0.45);
      --stroke-hover: rgba(56, 189, 248, 0.95);
      --fill-hover-start: #0f172a;
      --fill-hover-end: #1e293b;
      --text-main: #0f172a;
      --text-hover: #f8fafc;
      --accent: #0284c7;
      --glow: rgba(56, 189, 248, 0.35);
    }

    body.theme-emerald {
      /* Theme 2: Midnight Emerald */
      --bg-glass: rgba(8, 22, 19, 0.82);
      --bg-hub: rgba(6, 16, 14, 0.94);
      --stroke-base: rgba(110, 231, 183, 0.25);
      --stroke-hover: rgba(167, 243, 208, 0.95);
      --fill-hover-start: #10b981;
      --fill-hover-end: #047857;
      --text-main: #ecfdf5;
      --text-hover: #04130f;
      --accent: #34d399;
      --glow: rgba(16, 185, 129, 0.35);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 320px;
      height: 320px;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", sans-serif;
    }

    .radial-container {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65), 0 0 28px var(--glow);
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.78); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .slice-group {
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 140px 140px;
    }

    .slice-group:hover {
      transform: scale(1.045);
    }

    .slice-path {
      fill: var(--bg-glass);
      stroke: var(--stroke-base);
      stroke-width: 1.1px;
      transition: fill 0.15s ease, stroke 0.15s ease, filter 0.15s ease;
    }

    .slice-group:hover .slice-path {
      fill: url(#hoverGrad);
      stroke: var(--stroke-hover);
      stroke-width: 1.5px;
      filter: drop-shadow(0 0 10px var(--glow));
    }

    .slice-label {
      fill: var(--text-main);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.15s ease;
    }

    .slice-group:hover .slice-label {
      fill: var(--text-hover);
    }

    /* Center Luxury Medallion */
    .center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92px;
      height: 92px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--bg-hub);
      border: 1.4px solid var(--accent);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .center-hub:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 0 18px var(--glow);
    }

    .hub-badge {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .hub-sub {
      color: var(--text-main);
      opacity: 0.65;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-top: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="radial-container">
    <svg id="wheelSvg" viewBox="0 0 280 280">
      <defs>
        <linearGradient id="hoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--fill-hover-start)" />
          <stop offset="100%" stop-color="var(--fill-hover-end)" />
        </linearGradient>
      </defs>
      <!-- Outer Specular Hairline Rim -->
      <circle cx="140" cy="140" r="134" fill="none" stroke="var(--stroke-base)" stroke-width="0.8" />
      <g id="slicesContainer"></g>
    </svg>

    <div class="center-hub" id="centerHub" title="Click to switch Convert / Tools Mode (Press TAB for Theme)">
      <div class="hub-badge" id="extBadge">XLSX</div>
      <div class="hub-sub" id="modeLabel">CONVERT</div>
    </div>
  </div>

  <script>
    // Complete Offline Conversion Map (No Crop)
    const CONVERSION_MAP = {
      xlsx: { convert: ["JSON", "CSV", "HTML", "PDF", "TXT"], tools: ["SORT A-Z", "DEDUPE", "SUMMARY"] },
      csv:  { convert: ["JSON", "XLSX", "HTML", "PDF", "TXT"], tools: ["SORT A-Z", "DEDUPE", "SUMMARY"] },
      pdf:  { convert: ["DOCX", "TXT", "HTML", "JPG", "PNG"], tools: ["SUMMARY", "ALL PNG"] },
      docx: { convert: ["PDF", "TXT", "HTML", "RTF"], tools: ["SUMMARY", "UPPERCASE", "CLEAN TXT"] },
      pptx: { convert: ["PDF", "PNG", "TXT", "HTML"], tools: ["EXTRACT TXT", "SLIDE 1 PNG"] },
      png:  { convert: ["JPG", "WEBP", "HEIC", "TIFF", "BMP", "PDF"], tools: ["ADD BG", "COMPRESS", "GRAYSCALE"] },
      jpg:  { convert: ["PNG", "WEBP", "HEIC", "TIFF", "BMP", "PDF"], tools: ["ADD BG", "COMPRESS", "GRAYSCALE"] },
      json: { convert: ["CSV", "XLSX", "HTML", "PDF", "TXT"], tools: ["SUMMARY"] }
    };

    let currentExt = "xlsx";
    let currentFilePath = "";
    let isToolsMode = false;
    let themeIdx = 0;
    const themes = ["", "theme-titanium", "theme-emerald"];

    const cx = 140, cy = 140, rIn = 52, rOut = 126, gapDeg = 3.6;

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
      };
    }

    function createSlicePath(startAngle, endAngle) {
      const p1Out = polarToCartesian(cx, cy, rOut, endAngle);
      const p2Out = polarToCartesian(cx, cy, rOut, startAngle);
      const p1In  = polarToCartesian(cx, cy, rIn, endAngle);
      const p2In  = polarToCartesian(cx, cy, rIn, startAngle);
      const largeArc = endAngle - startAngle <= 180 ? "0" : "1";

      return [
        "M", p2Out.x, p2Out.y,
        "A", rOut, rOut, 0, largeArc, 1, p1Out.x, p1Out.y,
        "L", p1In.x, p1In.y,
        "A", rIn, rIn, 0, largeArc, 0, p2In.x, p2In.y,
        "Z"
      ].join(" ");
    }

    function renderWheel() {
      const container = document.getElementById("slicesContainer");
      container.innerHTML = "";

      const entry = CONVERSION_MAP[currentExt] || CONVERSION_MAP.png;
      const slices = isToolsMode ? entry.tools : entry.convert;
      const count = slices.length;
      const step = 360 / count;

      document.getElementById("extBadge").textContent = currentExt.toUpperCase();
      document.getElementById("modeLabel").textContent = isToolsMode ? "TOOLS" : "CONVERT";

      slices.forEach((label, i) => {
        const startDeg = (i * step) - (step / 2) + (gapDeg / 2);
        const endDeg   = ((i + 1) * step) - (step / 2) - (gapDeg / 2);
        const midDeg   = (startDeg + endDeg) / 2;

        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", "slice-group");

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "slice-path");
        path.setAttribute("d", createSlicePath(startDeg, endDeg));

        const textPos = polarToCartesian(cx, cy, (rIn + rOut) / 2, midDeg);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "slice-label");
        text.setAttribute("x", textPos.x);
        text.setAttribute("y", textPos.y);
        text.textContent = label;

        group.appendChild(path);
        group.appendChild(text);

        group.addEventListener("click", () => triggerOfflineConversion(label));
        container.appendChild(group);
      });
    }

    async function triggerOfflineConversion(targetAction) {
      if (window.__TAURI__) {
        await window.__TAURI__.core.invoke("convert_file_offline", {
          filePath: currentFilePath,
          action: targetAction
        });
      } else {
        console.log(`[Offline Preview] Converting .${currentExt} -> ${targetAction}`);
      }
    }

    // Center hub toggles Convert <-> Tools
    document.getElementById("centerHub").addEventListener("click", () => {
      isToolsMode = !isToolsMode;
      renderWheel();
    });

    // Keyboard controls: TAB cycles luxury themes, 1-5 previews different file types
    window.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        themeIdx = (themeIdx + 1) % themes.length;
        document.body.className = themes[themeIdx];
      } else if (e.key === "Escape" && window.__TAURI__) {
        window.__TAURI__.core.invoke("hide_wheel");
      }
    });

    // Listen for file-selected payload from Tauri Rust backend
    if (window.__TAURI__) {
      window.__TAURI__.event.listen("file-locked", (event) => {
        currentFilePath = event.payload.path;
        currentExt = event.payload.ext.toLowerCase();
        isToolsMode = false;
        renderWheel();
      });
    }

    renderWheel();
  </script>
</body>
</html>
